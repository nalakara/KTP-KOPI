<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Rounded Card Base -->
  <rect width="512" height="512" rx="112" fill="url(#coffeeGrad)" />
  
  <!-- Outer passport border -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.85" />
  
  <!-- Card Header Ribbon / Emblem -->
  <circle cx="256" cy="220" r="120" fill="#291102" stroke="#d97706" stroke-width="4" />
  
  <!-- Stylized Coffee Bean -->
  <path d="M 256 130 C 310 130, 345 170, 345 225 C 345 280, 310 320, 256 320 C 202 320, 167 280, 167 225 C 167 170, 202 130, 256 130 Z" fill="url(#goldGrad)" />
  <!-- Bean Center Crease (S-curve) -->
  <path d="M 256 140 C 280 180, 230 240, 260 310" fill="none" stroke="#451a03" stroke-width="14" stroke-linecap="round" />
  
  <!-- Text Label "COFFEE ID" -->
  <text x="256" y="390" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4">COFFEE ID</text>
  <text x="256" y="430" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="6">KTP KOPI</text>
</svg>
